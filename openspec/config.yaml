schema: spec-driven-with-adr

context: |
  Project: Murmurs — voice journal (record → transcribe → AI summarize → export/sync).
  Stage: pre-launch, no users. Target the current product model only: no backward-compatibility
  fields, legacy branches, or data migrations unless the user explicitly asks (AGENTS.md).
  Market: outside mainland China. Sign-in: Apple, Google, email OTP. Payments: RevenueCat subscriptions.
  Domains: production https://murmurs.denkit.app (not yet deployed), staging https://murmurs-staging.denkit.app (live).

  Sources of truth — read before designing:
    - adr/ (in-force architecture decisions, ADR-0001..0014)
    - openspec/specs/ (current capabilities)
    - docs/architecture.md (CURRENT system) · docs/roadmap.md (phases P0–P6)

  ## Current codebase (what exists today)
  Monorepo (ADR-0013):
    - apple/ — shipped iOS 18.0 / watchOS 11.0 app; all data local.
        Swift, SwiftUI-first with UIKit bridges (ADR-0007), MVVM with @Observable ViewModels;
        SwiftData: MemoEntity, SummaryEntity, PromptEntity, UsageEntity (Watch: RecordingEntity);
        Sources/Services: OpenAIClient (called directly from the client), Transcription (Apple Speech /
        OpenAI), live transcription (SpeechAnalyzer on iOS 26+, SFSpeechRecognizer before), StoreKit 1
        IAPManager, Readwise, Exporter; Shared/: AudioRecorder, WatchConnectivity, App Intents, Live Activity;
        targets Murmurs, MurmursWidget, MurmursWatch, MurmursWatchWidget, MurmursTests, SnapshotTests;
        xcodegen → apple/Murmurs.xcodeproj; configs Debug, Snapshot (SNAPSHOT flag), AppStore;
        SPM: KeychainAccess, ConfettiSwiftUI, DSWaveformImage, CSV.swift, TPPDF, MarkdownUI, XLog, XLang;
        secrets in Keychain, never UserDefaults
    - web/ — one Cloudflare Worker from react-tanstarter: TanStack Start placeholder web UI; Hono
        OpenAPI app at /api/v1 (src/server/api, mounted by src/routes/api/v1/$.ts) with GET /health and the
        { error: { code, message, details? } } envelope; Better Auth mounted with no providers (sign-in
        disabled); D1 via Drizzle with committed migrations in web/drizzle; wrangler envs dev (top level),
        staging, production; tests with Vitest 4 + @cloudflare/vitest-pool-workers
    - contract/ — openapi.json (OpenAPI 3.0.3, committed) + check-drift / check-breaking (oasdiff) /
        check-generators (swift-openapi-generator, Kotlin openapi-generator)
    - l10n/ — Localizable.csv (key, comment, platforms, en, zh-Hans) → `rake l10n` → Apple L(.key) and
        web i18next JSON (web keys under `web.`, placeholders %{n})

  ## Target architecture (being built per docs/roadmap.md)
    - Native client per platform (ADR-0001): apple/ (SwiftUI), android/ (Kotlin, Compose, Room,
      WorkManager), web/ (TanStack Start), desktop/ (Electron wrapping the live web app)
    - Thick server, thin clients (ADR-0002): transcription, AI, quotas, integrations run server-side;
      clients record, upload, store locally, display, edit
    - Cloudflare (ADR-0003), one Worker from react-tanstarter (ADR-0004): TanStack Start web UI +
      Hono API at /api/v1 (the ONLY API native clients call; server functions are web-internal) +
      Better Auth (ADR-0011) + D1 (accounts, entitlements, usage) + R2 (audio) + AI Gateway
    - Sync (ADR-0005): one Durable Object per user (SQLite) holds memos/summaries/prompts/settings;
      push/pull/ws protocol, row-level LWW on updated_at (tie-break device_id), UUIDv7 ids,
      soft delete, server-only fields (status, transcript, polished, ai_title)
    - Memo pipeline (ADR-0006): Cloudflare Workflows — per-segment transcribe → polish → title →
      write back to the DO → record usage
    - Offline-first native, online-first web (ADR-0009)
    - Contract (ADR-0010): generated clients in each app; /api/v1 is additive-only (ADR-0014)

  ## Verification commands by area
    - Apple (run xcodegen in apple/ first if project.yml or the layout changed):
        cd apple && xcodebuild build -project Murmurs.xcodeproj -scheme Murmurs -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
        cd apple && xcodebuild test  -project Murmurs.xcodeproj -scheme Murmurs -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
    - Web: pnpm --dir web check && pnpm --dir web test && pnpm --dir web build
    - Contract: pnpm --dir web contract:generate; contract/scripts/check-drift.sh; contract/scripts/check-breaking.sh;
        contract/scripts/check-generators.sh [swift|kotlin]
    - Localization: rake l10n; ruby l10n/test_generate.rb
    - android/ (from P5): ./gradlew build test
    - Specs: openspec validate --all --strict (also enforced by the pre-commit hook)

rules:
  proposal:
    - Keep proposals concise — state the problem, the solution, and non-goals
    - Include user-facing behavior description, not just technical details
    - Always include a "Non-goals" section to bound scope
    - List affected platforms/areas (apple, android, web, desktop, server, contract, l10n) and the roadmap phase (P0–P6)
    - Do not propose backward compatibility or data migration for pre-launch data unless the user asks
  specs:
    - Write requirements in English with SHALL/MUST; every requirement has at least one "#### Scenario:"
    - State cross-platform behavior once, platform-neutrally; put platform-specific differences in scenarios
    - Server-side behavior (sync, pipeline, quotas, auth) is specified by its observable API/sync effects
    - Follow existing naming conventions in the codebase
  design:
    - Read in-force ADRs first; stay coherent with them and raise conflicts under Open Questions instead of silently deviating
    - Specify affected files/modules per area; for API changes show the zod/OpenAPI shape; for synced data show the DO table change
    - Keep business logic server-side (ADR-0002); clients stay thin
    - Native clients use only /api/v1; never expose TanStack Start server functions to native clients
    - Apple — reference existing MVVM and protocol-based services, prefer extending existing abstractions, define protocols before implementations with mock-friendly design
    - Migration Plan covers deployment and rollback only; pre-launch data needs no migration
  adr:
    - Create a new ADR only for durable, cross-cutting decisions (new dependency, platform, data ownership, protocol, security model)
    - Never edit an accepted ADR; supersede it with a new one and set Supersedes
    - Follow adr/README.md and the architectural-decision-records skill preference (MADR minimal, English, status/date header)
  tasks:
    - Each task must be independently verifiable and include its verification command from the list above
    - Order across areas contract → server → clients (apple, then web, then android); within Apple, model → service → viewmodel → view
    - Keep each task small enough to verify in one edit-build cycle
    - Include tasks to update docs/architecture.md when structure changes and docs/roadmap.md when a phase item completes
